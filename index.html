<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hi Monday · แดชบอร์ดพอร์ตลงทุน</title>
  <meta name="description" content="หุ้น คริปโต เงินสด รวมทุกตัวเลขที่ต้องรู้ไว้ในหน้าเดียว ฟรี ไม่มีโฆษณา บน iPhone, iPad และ Android">
  <meta name="theme-color" content="#FFC107">

  <!-- How the link looks when shared in a chat or a bio. -->
  <meta property="og:title" content="Hi Monday · แดชบอร์ดพอร์ตลงทุน">
  <meta property="og:description" content="หุ้น คริปโต เงินสด รวมไว้ในหน้าเดียว ฟรี ไม่มีโฆษณา">
  <meta property="og:image" content="https://himondayapp.github.io/assets/app-icon.png">
  <meta property="og:url" content="https://himondayapp.github.io/">
  <meta property="og:type" content="website">

  <link rel="icon" type="image/png" href="assets/app-icon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@600;800&family=Noto+Sans+Thai:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --yellow: #FFC107;
      --ink: #1B1A17;
      --cream: #FFFDF7;
      --muted: #5A4A12;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--yellow);
      color: var(--ink);
      font-family: "Noto Sans Thai", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px calc(32px + env(safe-area-inset-bottom));
      text-align: center;
    }

    main {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero {
      position: relative;
      width: min(300px, 72vw);
    }

    .search-help {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 18px;
      box-shadow: 0 8px 18px rgba(90, 60, 0, 0.25);
    }

    /* The mascot, cut to a circle, on the picture's bottom right corner. */
    .hero-mascot {
      position: absolute;
      right: 3.5%;
      bottom: 2.5%;
      width: 24%;
      height: auto;
      border-radius: 50%;
      border: 3px solid var(--yellow);
    }

    h1 {
      font-family: "Kanit", sans-serif;
      font-weight: 800;
      font-size: clamp(40px, 11vw, 52px);
      line-height: 1.1;
      margin: 16px 0 8px;
      letter-spacing: -0.5px;
    }

    .tagline {
      font-family: "Kanit", sans-serif;
      font-weight: 600;
      font-size: 20px;
      line-height: 1.5;
      margin: 0;
    }

    .price {
      font-weight: 700;
      font-size: 16px;
      color: var(--muted);
      margin: 8px 0 28px;
    }

    .stores {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .store {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 64px;
      padding: 12px 22px;
      border-radius: 18px;
      background: var(--ink);
      color: var(--cream);
      text-decoration: none;
      box-shadow: 0 8px 18px rgba(90, 60, 0, 0.25);
      transition: transform 120ms ease;
    }

    .store:active { transform: scale(0.98); }

    .store[hidden] { display: none; }

    /* Room at the top for the arrow, which sits over the page's corner. */
    body.in-tiktok { align-items: flex-start; padding-top: 96px; }

    .menu-hint {
      position: fixed;
      top: 6px;
      right: 8px;
      z-index: 2;
      display: flex;
      align-items: flex-end;
      gap: 4px;
      color: var(--ink);
    }

    .menu-hint[hidden] { display: none; }

    .menu-hint-text {
      margin-bottom: 2px;
      padding: 8px 14px;
      border-radius: 14px;
      background: var(--ink);
      color: var(--cream);
      font-family: "Kanit", sans-serif;
      font-weight: 600;
      font-size: 15px;
      line-height: 1.35;
      text-align: left;
      box-shadow: 0 6px 14px rgba(90, 60, 0, 0.25);
    }

    .menu-hint-text b { color: var(--yellow); font-size: 20px; line-height: 1; }

    .menu-hint-arrow { flex: none; animation: nudge 1s ease-in-out infinite; }

    @keyframes nudge {
      50% { transform: translateY(-6px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .menu-hint-arrow { animation: none; }
    }

    .copy-link {
      width: 100%;
      border: 2px solid var(--ink);
      background: var(--cream);
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    /* The button's own link, laid over the whole page. No press animation here: a transform
       would shrink the overlay to the button the moment it is touched. */
    .store.everywhere::after {
      content: "";
      position: fixed;
      inset: 0;
    }

    .store.everywhere:active { transform: none; }

    .store-name {
      font-family: "Kanit", sans-serif;
      font-weight: 600;
      font-size: 22px;
    }

    .store-devices {
      font-size: 14px;
      opacity: 0.75;
    }

    .store:focus-visible {
      outline: 3px solid var(--cream);
      outline-offset: 3px;
    }

    .redirecting {
      font-size: 14px;
      color: var(--muted);
      margin: 20px 0 0;
      min-height: 1.5em;
    }

    .version {
      font-size: 12px;
      color: var(--muted);
      opacity: 0.6;
      margin: 12px 0 0;
    }
  </style>
</head>
<body>
  <!-- Shown only in TikTok's browser: points at its ⋯ menu, the way out to a real browser. -->
  <div class="menu-hint" id="menu-hint" hidden>
    <span class="menu-hint-text">แตะ <b>⋯</b> ตรงนี้ แล้วเลือก “เปิดในเบราว์เซอร์”<br>เพื่อดาวน์โหลดแอป</span>
    <svg class="menu-hint-arrow" viewBox="0 0 48 56" width="48" height="56" aria-hidden="true">
      <path d="M8 52 C 26 48, 36 34, 36 10" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
      <path d="M24 20 L36 6 L46 22" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <main>
    <!-- How to find the app by hand, for when the buttons lead nowhere, with the mascot
         sitting on its bottom right corner. -->
    <div class="hero" id="hero">
      <img class="search-help" id="search-help" src="assets/app-store-search.png"
           alt="หรือค้นใน App Store พิมพ์ &quot;Hi Monday&quot; แล้วมองหาไอคอนสีเหลือง" width="840" height="1050">
      <img class="hero-mascot" src="assets/mascot-circle.png" alt="น้องแกะ มาสคอตของ Hi Monday" width="360" height="360">
    </div>
    <h1>Hi Monday</h1>
    <p class="tagline">หุ้น · คริปโต · เงินสด<br>รวมทุกตัวเลขที่ต้องรู้ไว้ในหน้าเดียว</p>
    <p class="price">ฟรี · ไม่มีโฆษณา</p>

    <nav class="stores" aria-label="ดาวน์โหลดแอป">
      <a class="store" id="app-store" href="https://apps.apple.com/app/id6782075660">
        <span class="store-name">App Store</span>
        <span class="store-devices">iPhone · iPad</span>
      </a>
      <a class="store" id="google-play" href="https://play.google.com/store/apps/details?id=com.hellomonday">
        <span class="store-name">Google Play</span>
        <span class="store-devices">Android</span>
      </a>
      <!-- Shown only where the store buttons cannot work: the way out to a real browser. -->
      <button class="store copy-link" id="copy-link" type="button" hidden>
        <span class="store-name">คัดลอกลิงก์</span>
        <span class="store-devices"></span>
      </button>
    </nav>

    <p class="redirecting" id="redirecting" aria-live="polite"></p>

    <!-- Which copy of the page this is. Raise it with every change, so a browser still
         showing an old copy can be told from one where the change did not work. -->
    <p class="version" id="version">v13</p>
  </main>

  <script>
    // Send a phone or tablet straight to its own store, so most visitors never see this page.
    // Anything else — a computer, or a device this can't tell — stays here and picks a button.
    // Add ?stay to the address to see the page on a phone without being sent on.
    (function () {
      if (new URLSearchParams(location.search).has("stay")) return;
      var ua = navigator.userAgent;
      // iPadOS presents itself as a Mac; a Mac with a touch screen is an iPad.
      var isApple = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/.test(ua);
      // An Android is shown the same search in its own store.
      if (isAndroid) {
        var help = document.getElementById("search-help");
        help.src = "assets/google-play-search.png";
        help.alt = help.alt.replace("App Store", "Google Play");
      }
      var target = isApple ? document.getElementById("app-store")
        : isAndroid ? document.getElementById("google-play")
        : null;
      if (!target) return;
      var note = document.getElementById("redirecting");
      var storeName = target.querySelector(".store-name").textContent;

      // What TikTok's own browser allows depends on how the page was reached — worked out
      // by tapping every kind of store link on both kinds of phone (the scratch page for that,
      // try.html, is in this repository's history). From a chat it follows a store
      // link the visitor taps. From a profile link, which is how nearly everyone arrives:
      //   iPhone  — no store link of any kind gets through, tapped or not.
      //   Android — only the store's web address does, and it opens as a page inside TikTok
      //             where nobody is signed in, so nothing can be installed from it.
      // The store itself is asked for all the same, never its web page, and if TikTok refuses
      // so be it: the page stays, with the ways out that do work. An arrow at the top right
      // points at TikTok's own ⋯ menu, which opens the page in a real browser; a button copies
      // the address, which TikTok allows; and the picture shows how to search the store.
      var isTikTok = /musical_ly|trill|BytedanceWebview|TikTok/i.test(ua);
      // Beside the version, what this page took the browser for — so a report of "it does
      // not work" says which of these paths it was on.
      document.getElementById("version").textContent +=
        " · " + (isTikTok ? "tiktok " : "") + (isApple ? "ios" : "android");

      if (isTikTok) {
        document.getElementById(isApple ? "google-play" : "app-store").style.display = "none";
        document.body.classList.add("in-tiktok");
        document.getElementById("menu-hint").hidden = false;

        var copy = document.getElementById("copy-link");
        var copyName = copy.querySelector(".store-name");
        copy.querySelector(".store-devices").textContent = "ไปเปิดใน " + (isApple ? "Safari" : "Chrome");
        copy.hidden = false;
        copy.addEventListener("click", function () {
          navigator.clipboard.writeText("https://himondayapp.github.io/").then(
            function () { copyName.textContent = "คัดลอกแล้ว ✓"; },
            function () { copyName.textContent = "คัดลอกไม่ได้"; });
        });

        if (isAndroid) {
          // The Play app itself. Asked for from a hidden frame, so that a refusal cannot put
          // an error page where this one is.
          target.href = "market://details?id=com.hellomonday";
          var frame = document.createElement("iframe");
          frame.style.display = "none";
          frame.src = target.href;
          document.body.appendChild(frame);
        } else {
          // The App Store's address is the one form TikTok has ever passed on an iPhone, and
          // there it opens the App Store itself. Refused, it leaves the page as it is.
          location.href = target.href;
        }
        return;
      }

      note.textContent = "กำลังพาไปที่ " + storeName + "…";
      location.replace(target.href);
      // Still here and still on screen two seconds later: the browser refused to be sent on.
      // Stretch the one button that matters over the whole page, so a tap anywhere is a tap on
      // it. It stays a real link — a script sending the page on after a tap is no different
      // from the redirect that was just refused.
      setTimeout(function () {
        if (document.visibilityState !== "visible") return;
        document.getElementById(isApple ? "google-play" : "app-store").style.display = "none";
        target.classList.add("everywhere");
        note.textContent = "แตะที่ไหนก็ได้เพื่อเปิด " + storeName;
      }, 2000);
    })();
  </script>
</body>
</html>
