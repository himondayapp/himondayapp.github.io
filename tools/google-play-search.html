<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>Google Play search picture</title>
  <!-- Makes assets/google-play-search.png out of assets/app-store-search.png: the same picture
       with the store's name and its button painted over. Record it at 840 x 1050:

       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
         --window-size=840,1050 --virtual-time-budget=8000 \
         --screenshot=assets/google-play-search.png tools/google-play-search.html

       The numbers below are places in that 840 x 1050 picture. -->
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@800&family=Noto+Sans+Thai:wght@700&display=block" rel="stylesheet">
  <style>
    html, body { margin: 0; }
    .card { position: relative; width: 840px; height: 1050px; background: url("../assets/app-store-search.png") 0 0 / 840px 1050px; overflow: hidden; }
    /* Over "หรือค้นใน App Store". */
    .title {
      position: absolute; left: 0; right: 0; top: 66px; height: 82px;
      background: #F6F5F1; color: #16161A;
      font: 800 41.5px/82px "Kanit", sans-serif; text-align: center;
      padding-top: 2px; box-sizing: border-box;
    }
    /* Over the App Store's "รับ". */
    .wipe { position: absolute; left: 500px; top: 450px; width: 83px; height: 56px; background: #FFFFFF; }
    .install {
      position: absolute; right: 264px; top: 460px; height: 35px; padding: 0 15px;
      border-radius: 999px; background: #01875F; color: #FFFFFF;
      font: 700 17px/35px "Noto Sans Thai", sans-serif;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">หรือค้นใน Google Play</div>
    <div class="wipe"></div>
    <div class="install">ติดตั้ง</div>
  </div>
</body>
</html>
